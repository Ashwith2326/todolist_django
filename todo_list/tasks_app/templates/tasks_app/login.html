{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Todo App</title>
    <link rel="stylesheet" href="{% static 'tasks_app/css/style.css' %}">
</head>
<body>
<main class="auth-layout">
    <section class="auth-card">
        <a class="brand" href="{% url 'task-list' %}">Todo App</a>
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p class="muted">Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
    </section>
</main>
</body>
</html>
